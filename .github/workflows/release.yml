# Release: push a tag like v1.2.0 (or v1.2.0-beta.1) to build every client, publish the server
# image to GitHub's container registry, and create a GitHub Release with the downloads.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Optional secrets for a properly signed Android APK (otherwise it's signed with a throwaway
# debug key, and each release has to be uninstalled before installing the next):
#   ANDROID_KEYSTORE_BASE64   the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      number: ${{ steps.parse.outputs.number }}
      suffix: ${{ steps.parse.outputs.suffix }}
      code: ${{ steps.parse.outputs.code }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::Tags must look like v1.2.3 or v1.2.3-beta.1 (got $TAG)"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          {
            echo "version=${TAG#v}"
            echo "number=$major.$minor.$patch"
            echo "suffix=${BASH_REMATCH[5]}"
            # Android's versionCode must grow with every release: 1.2.3 -> 100200399, and a
            # pre-release of it -> 100200300, so the final release installs over its betas.
            echo "code=$(( (major * 1000000 + minor * 1000 + patch) * 100 + (${#BASH_REMATCH[5]} > 0 ? 0 : 99) ))"
          } >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Format, lint, typecheck and test
        run: bun run check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version, check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Emulates arm64 for the image's final stage (the web build runs natively).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2 and latest for a release; only the full version for a pre-release.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: version
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json

      - name: Test
        run: dotnet test

      - name: Put vswhere on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Publish (NativeAOT)
        env:
          NUMBER: ${{ needs.version.outputs.number }}
          SUFFIX: ${{ needs.version.outputs.suffix }}
        run: dotnet publish src/Notaekinesis.App -c Release -p:VersionPrefix=$env:NUMBER -p:VersionSuffix=$env:SUFFIX

      - name: Zip
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $publish = "src/Notaekinesis.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish"
          Compress-Archive -Path "$publish/*" -DestinationPath "$env:RUNNER_TEMP/notaekinesis-windows-x64-$env:VERSION.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/notaekinesis-windows-x64-*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: version
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi

      - name: Test and build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          ./gradlew :core:test :app:assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/notaekinesis-android-$VERSION.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/notaekinesis-android-*.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [version, docker, windows, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.suffix != '' }}
        run: |
          image="${IMAGE,,}" # registry names are lower case
          notes="Server image: \`docker pull $image\`"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes --notes "$notes" "${flags[@]}"
