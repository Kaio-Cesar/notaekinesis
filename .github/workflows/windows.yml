# Windows client: Core tests, then a NativeAOT release publish uploaded as an artifact.
name: Windows

on:
  push:
    branches: [main]
    paths: &paths
      - windows/**
      - .github/workflows/windows.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: windows

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json

      - name: Test
        run: dotnet test

      # The NativeAOT linker finds MSVC through vswhere, which isn't on PATH by default.
      - name: Put vswhere on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Publish (NativeAOT)
        run: dotnet publish src/Notaekinesis.App -c Release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notaekinesis-windows-x64
          path: windows/src/Notaekinesis.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/
          if-no-files-found: error
