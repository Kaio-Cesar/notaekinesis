# Server and web app: format, lint, typecheck, tests, web build, and the Docker image.
name: Server and web

on:
  push:
    branches: [main]
    paths: &paths
      - server/**
      - web/**
      - tests/**
      - api/**
      - deploy/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - .oxfmtrc.json
      - .oxlintrc.json
      - .github/workflows/server-web.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager: bun@x.y.z

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format, lint, typecheck and test
        run: bun run check

      - name: Build
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds only; publishing to a registry can be added once there is one.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
