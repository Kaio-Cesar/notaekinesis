[install]
# Only install package versions that have been published for at least 7 days
# (supply-chain protection against freshly published malicious releases).
minimumReleaseAge = 604800 # 7 days, in seconds

[test]
root = "./tests"

[run]
# Run package bins with a `node` shebang (e.g. the wxt CLI) on Bun as well.
bun = true
